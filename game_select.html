<!DOCTYPE html>
<html lang="en">
    <head>
        <title>We Play!!</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.png">
        <link rel="stylesheet" href="styles/cards.css">
    </head>
    <body>
        <h1 class="text-center">Choose Your Game!</h1>

        <div id="notes">
            <hr>
            <br>
            <button onclick="update_points(); document.location.href='cards.html';">
                Go Back to Main Page!
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-arrow-left-square-fill" viewBox="0 0 16 16">
                    <path d="M16 14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2zm-4.5-6.5H5.707l2.147-2.146a.5.5 0 1 0-.708-.708l-3 3a.5.5 0 0 0 0 .708l3 3a.5.5 0 0 0 .708-.708L5.707 8.5H11.5a.5.5 0 0 0 0-1"/>
                </svg>
            </button>

            <br><br><br>

            <button onclick="update_points(); document.location.href='shop.html'">
                Go to the Shop!
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-cart-fill" viewBox="0 0 16 16">
                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                </svg>
            </button>
            <br><br>
            <hr>
        </div>

        <!-- Table to Hold Game Cards -->
         <table id="games_table">
            <tr><td id="0" onclick="sessionStorage.setItem('game_to_load', id); document.location.href='game.html'">
                <img><br>
                Tilt and Nom!
            </td></tr>
            <tr><td id="1" onclick="sessionStorage.setItem('game_to_load', id); document.location.href='game.html'">
                <img><br>
                Game 2!
            </td></tr>
            <tr><td id="2" onclick="sessionStorage.setItem('game_to_load', id); document.location.href='game.html'">
                <img><br>
                Game 3!
            </td></tr>
            <tr><td id="3" onclick="sessionStorage.setItem('game_to_load', id); document.location.href='game.html'">
                <img><br>
                Game 4!
            </td></tr>
         </table>

         <script src="scripts/save_score_into_points.js"></script>
         <script>update_points();</script>
    </body>
</html>
