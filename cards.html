<!DOCTYPE html>
<html lang="en">
    <head>
        <title>100 Reasons Why I Love You!!</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.png">
        
        <link rel="stylesheet" href="styles/cards.css">
    </head>

    <body>
        <h1 class="text-center">100 Reasons Why I Love You!</h1>

        <button>
            Go For Game Time!
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-arrow-right-square-fill" viewBox="0 0 16 16">
                <path d="M0 14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2zm4.5-6.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5a.5.5 0 0 1 0-1"/>
            </svg>
        </button>

        <br><br><br><br>

        <div id="notes">
            <hr>
            <p id="unlock_counter">You have unlocked 0 out of 100 cards!</p>
            <p id="lockpick_counter">You have 0 lockpicks available to use!</p>
            <p>You can tap unlocked cards to make the text bigger!</p>
            <hr>
        </div>

        <!-- Table to hold all 100 cards -->
        <table id="card_table"></table>

        <script src="scripts/reasons.js"></script>
        <script src="scripts/cards.js"></script>
    </body>
</html>
