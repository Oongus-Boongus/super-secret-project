<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Time for Shopping!!</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.png">
        <link rel="stylesheet" href="styles/cards.css">
    </head>

    <body>
        <h1 class="text-center">Points Shop</h1>

        <button onclick="document.location.href='cards.html';">
            Go Back to Game Select!
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-arrow-left-square-fill" viewBox="0 0 16 16">
                <path d="M16 14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2zm-4.5-6.5H5.707l2.147-2.146a.5.5 0 1 0-.708-.708l-3 3a.5.5 0 0 0 0 .708l3 3a.5.5 0 0 0 .708-.708L5.707 8.5H11.5a.5.5 0 0 0 0-1"/>
            </svg>
        </button>

        <br><br><br><br>

        <div id="notes">
            <hr>
            <p id="point_counter">You currently have 0 points!</p>
            <p id="lockpick_counter">You currently have 0 lockpicks!</p>
            <hr>
        </div>

        <!-- Table to hold shop cards -->
        <table id="shop_table">
            <tr>
                <td id="shop_card_1">Lockpick x1 <br> Price: 100 pts.</td>
                <td id="shop_card_2">Lockpick x5 <br> Price: 400 pts.</td>
            </tr>
        </table>

        <script src="scripts/shop.js"></script>
    </body>
</html>
