<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Mwehehe</title>
        <style>
            body {
                background-color: black;
                color: pink;
                text-align: center;
                font-size: 2.5vh;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }

            input {
                text-align: center;
                font-size: 3vh;
                width: 80%;
                height: 2.5vh;
                background-color: black;
                border: none;
                color: pink;
                caret-color: red;
            }

            ::placeholder {
                color: pink;
            }

            :focus {
                outline: none;
            }

            div {
                /* border: 3px solid green; */
                width: 100%;
            }

            .center {
                display: grid;
                place-items: center;
                height: 100vh;
                overflow: auto;
            }

            button {
                background-color: pink;
                padding: 10px;
                border-radius: 5px;
                color: black;
                font-family: inherit;
                font-size: inherit;
                border: none;
            }
        </style>
    </head>

    <body>
        <div class="center">
            <div>
                <h1>Enter Password: </h1>

                <input id="input_box" type="password" placeholder="Tap me to type here!">
                
                <br><br>

                <button id="enter">Enter!</button>
            </div>         
        </div>
        
    </body>
    <script>
        let password_box = document.getElementById("input_box")

        document.getElementById("enter").onclick = function () {
            if (password_box.value == "hello") {
                document.location.href = "jinnie.html";
            }
        };
    </script>
</html>
